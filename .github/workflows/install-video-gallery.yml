name: Install Cinta Kita video gallery
on:
  push:
    paths:
      - '.github/workflows/install-video-gallery.yml'
      - 'scripts/install-video-gallery.py'
      - 'video-gallery-v1.js'
      - 'video-gallery-v1.css'
      - 'story-gallery-v1.js'
      - 'story-gallery-v1.css'
      - 'story-gallery-v2.js'
      - 'story-gallery-v2.css'
      - 'story-gallery-v3.js'
      - 'story-gallery-v3.css'
      - 'story-gallery-v4.js'
      - 'story-gallery-v4.css'
      - 'story-gallery-v5.js'
      - 'story-gallery-v5.css'
      - 'story-gallery-v6.js'
      - 'story-gallery-v6.css'
      - 'story-gallery-v7.js'
      - 'story-gallery-v7.css'
      - 'story-gallery-v8.js'
      - 'story-gallery-v8.css'
      - 'story-gallery-v9.js'
      - 'story-gallery-v9.css'
      - 'story-gallery-v10.js'
      - 'story-gallery-v10.css'
      - 'story-gallery-v11.js'
      - 'story-gallery-v11.css'
      - 'story-gallery-v12.css'
      - 'story-gallery-v13.css'
      - 'story-gallery-v14.css'
      - 'story-gallery-v14.js'
permissions:
  contents: write
concurrency:
  group: install-cinta-kita-gallery
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check gallery JavaScript syntax
        run: |
          node --check video-gallery-v1.js
          node --check story-gallery-v1.js
          node --check story-gallery-v2.js
          node --check story-gallery-v3.js
          node --check story-gallery-v4.js
          node --check story-gallery-v5.js
          node --check story-gallery-v6.js
          node --check story-gallery-v7.js
          node --check story-gallery-v8.js
          node --check story-gallery-v9.js
          node --check story-gallery-v10.js
          node --check story-gallery-v11.js
          node --check story-gallery-v14.js
      - name: Safely connect gallery to existing Videos section
        run: python scripts/install-video-gallery.py
      - name: Commit only the HTML integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Connect redesigned video gallery to existing Supabase videos'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
