<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Our Place</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
      overflow-x: hidden;
    }

    #intro {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: black;
      overflow: hidden;
      transition: opacity 1s ease;
    }

    #catButton {
      position: relative;
      width: min(600px, 85vw);
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
    }

    #catPicture {
      display: block;
      width: 100%;
      height: auto;
      max-height: 60vh;
      object-fit: contain;
      animation: float 2.4s ease-in-out infinite;
      transition: opacity 0.25s ease;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-9px); }
    }

    .musicNote {
      position: absolute;
      font-size: 35px;
      opacity: 0;
      pointer-events: none;
    }

    .musicNote.left { left: 8%; top: 25%; }
    .musicNote.right { right: 8%; top: 35%; animation-delay: 0.8s !important; }

    #catButton.dancing .musicNote {
      animation: noteRise 1.6s ease-out infinite;
    }

    @keyframes noteRise {
      0% { opacity: 0; transform: translateY(20px); }
      25% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-85px); }
    }

    #catButton.walking {
      animation: walkAway 2.4s ease-in forwards;
    }

    #catButton.walking #catPicture {
      animation: footsteps 0.32s ease-in-out infinite alternate;
    }

    @keyframes footsteps {
      from { transform: rotate(-2deg) translateY(0); }
      to { transform: rotate(2deg) translateY(-7px); }
    }

    @keyframes walkAway {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      75% { opacity: 1; }
      100% { transform: translateY(-100px) scale(0.12); opacity: 0; }
    }

    #introText {
      margin-top: 8px;
      font-size: 18px;
      letter-spacing: 2px;
      opacity: 0.7;
      transition: opacity 0.4s ease;
    }

    #musicButton {
      margin-top: 24px;
      padding: 13px 26px;
      border: 1px solid #ffb9d2;
      border-radius: 999px;
      background: #ffcfdf;
      color: #6b2445;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 158, 196, 0.25);
      transition: transform 0.2s ease, background 0.2s ease, opacity 0.4s ease;
    }

    #musicButton:hover {
      transform: scale(1.06);
      background: #ffe0eb;
    }

    .heart {
      position: absolute;
      left: 50%;
      top: 43%;
      opacity: 0;
      pointer-events: none;
      font-size: 38px;
    }

    #intro.loving .heart {
      animation: rise 1.6s ease-out forwards;
    }

    .heart:nth-of-type(1) { --side: -90px; animation-delay: 0s !important; }
    .heart:nth-of-type(2) { --side: 10px; animation-delay: 0.18s !important; }
    .heart:nth-of-type(3) { --side: 100px; animation-delay: 0.35s !important; }

    @keyframes rise {
      0% { opacity: 0; transform: translate(-50%, 10px) scale(0.4); }
      25% { opacity: 1; }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--side)), -160px) scale(1.3);
      }
    }

    .wind {
      position: absolute;
      left: -180px;
      width: 120px;
      height: 3px;
      border-radius: 100%;
      background: rgba(255, 255, 255, 0.5);
      opacity: 0;
      pointer-events: none;
    }

    .wind.one { top: 38%; }
    .wind.two { top: 55%; width: 85px; }
    .wind.three { top: 68%; width: 150px; }

    #intro.breezy .wind {
      animation: windBlow 1.15s linear infinite;
    }

    #intro.breezy .wind.two { animation-delay: 0.3s; }
    #intro.breezy .wind.three { animation-delay: 0.65s; }

    @keyframes windBlow {
      0% { left: -180px; opacity: 0; }
      20%, 80% { opacity: 0.5; }
      100% { left: 110%; opacity: 0; }
    }

    #mainWebsite {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      text-align: center;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 1.5s ease, transform 1.5s ease;
    }

    #mainWebsite.show {
      opacity: 1;
      transform: translateY(0);
    }

    h1 {
      font-size: clamp(40px, 8vw, 90px);
      margin: 0 0 10px;
    }

    p { font-size: 18px; opacity: 0.75; }
  </style>
</head>

<body>
  <div id="intro">
    <button id="catButton" aria-label="Enter the website">
      <img id="catPicture" src="Holding Hands.png" alt="Two cats holding hands">
      <span class="musicNote left">♫</span>
      <span class="musicNote right">♪</span>
    </button>

    <span class="heart">💗</span>
    <span class="heart">💕</span>
    <span class="heart">💗</span>

    <span class="wind one"></span>
    <span class="wind two"></span>
    <span class="wind three"></span>

    <div id="introText">click us ♡</div>
    <button id="musicButton" type="button">♫ Play music ♡</button>
  </div>

  <main id="mainWebsite">
    <h1>Welcome ❤️</h1>
    <p>A little place made just for you.</p>
  </main>

  <audio
    id="introMusic"
    src="Ariana Grande - everytime (Official Instrumental).mp3"
    loop
    preload="auto"
  ></audio>

  <script>
    const intro = document.getElementById("intro");
    const catButton = document.getElementById("catButton");
    const catPicture = document.getElementById("catPicture");
    const introText = document.getElementById("introText");
    const mainWebsite = document.getElementById("mainWebsite");
    const musicButton = document.getElementById("musicButton");
    const introMusic = document.getElementById("introMusic");

    const danceFrames = [
      "Dance 1.png",
      "Dance 2.png",
      "Dance 3.png",
      "Dance 4.png"
    ];

    // Load the pictures before the first dance.
    [...danceFrames, "Walking Away.png"].forEach(function (filename) {
      const picture = new Image();
      picture.src = filename;
    });

    let clicked = false;
    let danceTimer = null;
    let frameNumber = 0;
    let soundContext;

    function startDance() {
      if (danceTimer) return;

      frameNumber = 0;
      catPicture.src = danceFrames[frameNumber];
      catPicture.alt = "Two cats dancing";
      catButton.classList.add("dancing");

      danceTimer = setInterval(function () {
        frameNumber = (frameNumber + 1) % danceFrames.length;
        catPicture.src = danceFrames[frameNumber];
      }, 220);
    }

    function stopDance() {
      clearInterval(danceTimer);
      danceTimer = null;
      catButton.classList.remove("dancing");
      catPicture.src = "Holding Hands.png";
      catPicture.alt = "Two cats holding hands";
    }

    musicButton.addEventListener("click", async function () {
      if (introMusic.paused) {
        try {
          await introMusic.play();
          musicButton.textContent = "♫ Pause music ♡";
          startDance();
        } catch (error) {
          musicButton.textContent = "Could not play music";
        }
      } else {
        introMusic.pause();
        musicButton.textContent = "♫ Play music ♡";
        stopDance();
      }
    });

    function note(frequency, start, duration, volume) {
      const oscillator = soundContext.createOscillator();
      const gain = soundContext.createGain();

      oscillator.type = "sine";
      oscillator.frequency.value = frequency;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(volume, start + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, start + duration);

      oscillator.connect(gain);
      gain.connect(soundContext.destination);
      oscillator.start(start);
      oscillator.stop(start + duration);
    }

    function heartSound() {
      const now = soundContext.currentTime;
      note(660, now, 0.25, 0.09);
      note(880, now + 0.12, 0.4, 0.07);
    }

    function footstep() {
      note(110, soundContext.currentTime, 0.09, 0.045);
    }

    function windSound() {
      const length = Math.floor(soundContext.sampleRate * 1.5);
      const buffer = soundContext.createBuffer(1, length, soundContext.sampleRate);
      const data = buffer.getChannelData(0);

      for (let i = 0; i < length; i++) {
        data[i] = Math.random() * 2 - 1;
      }

      const source = soundContext.createBufferSource();
      const filter = soundContext.createBiquadFilter();
      const gain = soundContext.createGain();
      const now = soundContext.currentTime;

      source.buffer = buffer;
      filter.type = "lowpass";
      filter.frequency.value = 500;
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.035, now + 0.4);
      gain.gain.linearRampToValueAtTime(0.001, now + 1.5);

      source.connect(filter);
      filter.connect(gain);
      gain.connect(soundContext.destination);
      source.start(now);
    }

    catButton.addEventListener("click", function () {
      if (clicked) return;
      clicked = true;

      introMusic.pause();
      introMusic.currentTime = 0;
      stopDance();
      musicButton.style.opacity = "0";
      musicButton.disabled = true;

      soundContext = new (window.AudioContext || window.webkitAudioContext)();
      soundContext.resume();
      heartSound();

      introText.style.opacity = "0";
      intro.classList.add("loving");

      setTimeout(function () {
        catPicture.style.opacity = "0";

        setTimeout(function () {
          catPicture.src = "Walking Away.png";
          catPicture.alt = "Two cats walking away together";
          catPicture.style.opacity = "1";

          intro.classList.add("breezy");
          catButton.classList.add("walking");

          windSound();
          footstep();
          setTimeout(footstep, 350);
          setTimeout(footstep, 700);
          setTimeout(footstep, 1050);
          setTimeout(footstep, 1400);
        }, 250);
      }, 1100);

      setTimeout(function () {
        intro.style.opacity = "0";
        mainWebsite.classList.add("show");
      }, 3850);

      setTimeout(function () {
        intro.style.display = "none";
      }, 4850);
    });
  </script>
</body>
</html>
