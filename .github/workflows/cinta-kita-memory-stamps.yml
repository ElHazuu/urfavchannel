name: Cinta Kita private-memory safety check
# Location-only public pins are allowed. This workflow never exports Supabase data.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cinta-kita-memory-stamps.yml'
permissions:
  contents: read
jobs:
  safety-check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public exporter is paused
        run: echo "Private memory details remain in Supabase. Scheduled public publishing is disabled."
