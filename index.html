<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Our Place</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
      overflow-x: hidden;
    }

    #intro {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: black;
      overflow: hidden;
      transition: opacity 1s ease;
    }

    #catButton {
      position: relative;
      width: min(600px, 85vw);
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
    }

    #catPicture {
      display: block;
      width: 100%;
      height: auto;
      max-height: 60vh;
      object-fit: contain;
      animation: float 2.4s ease-in-out infinite;
      transition: opacity 0.25s ease;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-9px); }
    }

    .musicNote {
      position: absolute;
      font-size: 35px;
      opacity: 0;
      pointer-events: none;
    }

    .musicNote.left { left: 8%; top: 25%; }
    .musicNote.right { right: 8%; top: 35%; animation-delay: 0.8s !important; }

    #catButton.dancing .musicNote {
      animation: noteRise 1.6s ease-out infinite;
    }

    @keyframes noteRise {
      0% { opacity: 0; transform: translateY(20px); }
      25% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-85px); }
    }

    #catButton.walking {
      animation: walkAway 2.4s ease-in forwards;
    }

    #catButton.walking #catPicture {
      animation: footsteps 0.32s ease-in-out infinite alternate;
    }

    @keyframes footsteps {
      from { transform: rotate(-2deg) translateY(0); }
      to { transform: rotate(2deg) translateY(-7px); }
    }

    @keyframes walkAway {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      75% { opacity: 1; }
      100% { transform: translateY(-100px) scale(0.12); opacity: 0; }
    }

    #introText {
      margin-top: 8px;
      font-size: 18px;
      letter-spacing: 2px;
      opacity: 0.7;
      transition: opacity 0.4s ease;
    }

    #musicButton {
      margin-top: 24px;
      padding: 13px 26px;
      border: 1px solid #ffb9d2;
      border-radius: 999px;
      background: #ffcfdf;
      color: #6b2445;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 158, 196, 0.25);
      transition: transform 0.2s ease, background 0.2s ease, opacity 0.4s ease;
    }

    #musicButton:hover {
      transform: scale(1.06);
      background: #ffe0eb;
    }

    .heart {
      position: absolute;
      left: 50%;
      top: 43%;
      opacity: 0;
      pointer-events: none;
      font-size: 38px;
    }

    #intro.loving .heart {
      animation: rise 1.6s ease-out forwards;
    }

    .heart:nth-of-type(1) { --side: -90px; animation-delay: 0s !important; }
    .heart:nth-of-type(2) { --side: 10px; animation-delay: 0.18s !important; }
    .heart:nth-of-type(3) { --side: 100px; animation-delay: 0.35s !important; }

    @keyframes rise {
      0% { opacity: 0; transform: translate(-50%, 10px) scale(0.4); }
      25% { opacity: 1; }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--side)), -160px) scale(1.3);
      }
    }

    .wind {
      position: absolute;
      left: -180px;
      width: 120px;
      height: 3px;
      border-radius: 100%;
      background: rgba(255, 255, 255, 0.5);
      opacity: 0;
      pointer-events: none;
    }

    .wind.one { top: 38%; }
    .wind.two { top: 55%; width: 85px; }
    .wind.three { top: 68%; width: 150px; }

    #intro.breezy .wind {
      animation: windBlow 1.15s linear infinite;
    }

    #intro.breezy .wind.two { animation-delay: 0.3s; }
    #intro.breezy .wind.three { animation-delay: 0.65s; }

    @keyframes windBlow {
      0% { left: -180px; opacity: 0; }
      20%, 80% { opacity: 0.5; }
      100% { left: 110%; opacity: 0; }
    }

    #mainWebsite {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      text-align: center;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 1.5s ease, transform 1.5s ease;
    }

    #mainWebsite.show {
      opacity: 1;
      transform: translateY(0);
    }

    h1 {
      font-size: clamp(40px, 8vw, 90px);
      margin: 0 0 10px;
    }

    p { font-size: 18px; opacity: 0.75; }
    /* Dance background — appears only while music plays */
#intro:has(#catButton.dancing) {
  background:
    radial-gradient(ellipse at 50% 82%, rgba(255, 151, 208, 0.32), transparent 42%),
    radial-gradient(circle at 25% 30%, rgba(160, 112, 255, 0.22), transparent 35%),
    radial-gradient(circle at 78% 35%, rgba(255, 121, 176, 0.20), transparent 35%),
    #100917;
  animation: danceLights 2.5s ease-in-out infinite alternate;
}

@keyframes danceLights {
  from { background-color: #100917; }
  to { background-color: #23112d; }
}

/* Small floating sparkles */
#intro:has(#catButton.dancing)::before {
  content: "✦     ·        ✧       ·     ✦";
  position: absolute;
  top: 15%;
  left: 0;
  width: 100%;
  color: #ffd6e9;
  font-size: clamp(18px, 3vw, 34px);
  letter-spacing: 5vw;
  text-align: center;
  opacity: 0.7;
  pointer-events: none;
  animation: sparkleFloat 2.8s ease-in-out infinite alternate;
}

@keyframes sparkleFloat {
  from { transform: translateY(0); opacity: 0.35; }
  to { transform: translateY(-22px); opacity: 0.9; }
}

/* Soft spotlight beneath the cats */
#catButton.dancing::after {
  content: "";
  position: absolute;
  bottom: 2%;
  left: 15%;
  width: 70%;
  height: 28px;
  border-radius: 50%;
  background: #ffabd6;
  filter: blur(25px);
  opacity: 0.55;
  pointer-events: none;
  z-index: -1;
}
  </style>
</head>
<body>
  <div id="intro">
    <button id="catButton" aria-label="Enter the website">
      <img id="catPicture" src="Holding Hands.png" alt="Two cats holding hands">
      <span class="musicNote left">♫</span>
      <span class="musicNote right">♪</span>
    </button>

    <span class="heart">💗</span>
    <span class="heart">💕</span>
    <span class="heart">💗</span>

    <span class="wind one"></span>
    <span class="wind two"></span>
    <span class="wind three"></span>

    <div id="introText">click us ♡</div>
    <button id="musicButton" type="button">♫ Play music ♡</button>
  </div>

  <main id="mainWebsite">
    <h1>Welcome ❤️</h1>
    <p>A little place made just for you.</p>
  </main>

  <audio
    id="introMusic"
    src="Ariana Grande - everytime (Official Instrumental).mp3"
    loop
    preload="auto"
  ></audio>

  <script>
    const intro = document.getElementById("intro");
    const catButton = document.getElementById("catButton");
    const catPicture = document.getElementById("catPicture");
    const introText = document.getElementById("introText");
    const mainWebsite = document.getElementById("mainWebsite");
    const musicButton = document.getElementById("musicButton");
    const introMusic = document.getElementById("introMusic");

    const danceFrames = [
      "Dance 1.png",
      "Dance 2.png",
      "Dance 3.png",
      "Dance 4.png"
    ];

    // Load the pictures before the first dance.
    [...danceFrames, "Walking Away.png"].forEach(function (filename) {
      const picture = new Image();
      picture.src = filename;
    });

    let clicked = false;
    let danceTimer = null;
    let frameNumber = 0;
    let soundContext;

    function startDance() {
      if (danceTimer) return;

      frameNumber = 0;
      catPicture.src = danceFrames[frameNumber];
      catPicture.alt = "Two cats dancing";
      catButton.classList.add("dancing");

      danceTimer = setInterval(function () {
        frameNumber = (frameNumber + 1) % danceFrames.length;
        catPicture.src = danceFrames[frameNumber];
      }, 220);
    }

    function stopDance() {
      clearInterval(danceTimer);
      danceTimer = null;
      catButton.classList.remove("dancing");
      catPicture.src = "Holding Hands.png";
      catPicture.alt = "Two cats holding hands";
    }

    musicButton.addEventListener("click", async function () {
      if (introMusic.paused) {
        try {
          await introMusic.play();
          musicButton.textContent = "♫ Pause music ♡";
          startDance();
        } catch (error) {
          musicButton.textContent = "Could not play music";
        }
      } else {
        introMusic.pause();
        musicButton.textContent = "♫ Play music ♡";
        stopDance();
      }
    });

    function note(frequency, start, duration, volume) {
      const oscillator = soundContext.createOscillator();
      const gain = soundContext.createGain();

      oscillator.type = "sine";
      oscillator.frequency.value = frequency;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(volume, start + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, start + duration);

      oscillator.connect(gain);
      gain.connect(soundContext.destination);
      oscillator.start(start);
      oscillator.stop(start + duration);
    }

    function heartSound() {
      const now = soundContext.currentTime;
      note(660, now, 0.25, 0.09);
      note(880, now + 0.12, 0.4, 0.07);
    }

    function footstep() {
      note(110, soundContext.currentTime, 0.09, 0.045);
    }

    function windSound() {
      const length = Math.floor(soundContext.sampleRate * 1.5);
      const buffer = soundContext.createBuffer(1, length, soundContext.sampleRate);
      const data = buffer.getChannelData(0);

      for (let i = 0; i < length; i++) {
        data[i] = Math.random() * 2 - 1;
      }

      const source = soundContext.createBufferSource();
      const filter = soundContext.createBiquadFilter();
      const gain = soundContext.createGain();
      const now = soundContext.currentTime;

      source.buffer = buffer;
      filter.type = "lowpass";
      filter.frequency.value = 500;
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.035, now + 0.4);
      gain.gain.linearRampToValueAtTime(0.001, now + 1.5);

      source.connect(filter);
      filter.connect(gain);
      gain.connect(soundContext.destination);
      source.start(now);
    }

    catButton.addEventListener("click", function () {
      if (clicked) return;
      clicked = true;

      introMusic.pause();
      introMusic.currentTime = 0;
      stopDance();
      musicButton.style.opacity = "0";
      musicButton.disabled = true;

      soundContext = new (window.AudioContext || window.webkitAudioContext)();
      soundContext.resume();
      heartSound();

      introText.style.opacity = "0";
      intro.classList.add("loving");

      setTimeout(function () {
        catPicture.style.opacity = "0";

        setTimeout(function () {
          catPicture.src = "Walking Away.png";
          catPicture.alt = "Two cats walking away together";
          catPicture.style.opacity = "1";

          intro.classList.add("breezy");
          catButton.classList.add("walking");

          windSound();
          footstep();
          setTimeout(footstep, 350);
          setTimeout(footstep, 700);
          setTimeout(footstep, 1050);
          setTimeout(footstep, 1400);
        }, 250);
      }, 1100);

      setTimeout(function () {
        intro.style.opacity = "0";
        mainWebsite.classList.add("show");
      }, 3850);

      setTimeout(function () {
        intro.style.display = "none";
      }, 4850);
    });
  </script>
  <style>
  /* Extra glow that responds to the song */
  #intro {
    --beat-glow: 18px;
    --beat-lift: 0px;
    --beat-zoom: 1;
    --beat-light: 0.25;
  }

  #intro::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 50% 55%, #ff79bc 0%, transparent 42%),
      radial-gradient(circle at 25% 30%, #9c78ff 0%, transparent 30%),
      radial-gradient(circle at 80% 35%, #ffb2d7 0%, transparent 30%);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.1s linear;
  }

  #intro:has(#catButton.dancing)::after {
    opacity: var(--beat-light);
  }

  #catButton,
  #introText,
  #musicButton {
    z-index: 1;
  }

  #catButton.dancing {
    transform: translateY(var(--beat-lift)) scale(var(--beat-zoom));
    filter: drop-shadow(0 0 var(--beat-glow) #ff80c4);
    transition: transform 0.08s linear, filter 0.08s linear;
  }
</style>

<script>
  // Read the song's bass levels and turn them into light and movement.
  (function () {
    const music = document.getElementById("introMusic");
    const button = document.getElementById("musicButton");
    const introScreen = document.getElementById("intro");

    let beatAudioContext;
    let analyser;
    let frequencies;
    let animationFrame;
    let average = 0;
    let pulse = 0;

    button.addEventListener("click", function () {
      if (!beatAudioContext) {
        beatAudioContext =
          new (window.AudioContext || window.webkitAudioContext)();

        const source = beatAudioContext.createMediaElementSource(music);
        analyser = beatAudioContext.createAnalyser();
        analyser.fftSize = 2048;
        frequencies = new Uint8Array(analyser.frequencyBinCount);

        source.connect(analyser);
        analyser.connect(beatAudioContext.destination);
      }

      beatAudioContext.resume();
    });

    function animateToMusic() {
      if (music.paused || !analyser) return;

      analyser.getByteFrequencyData(frequencies);

      const hzPerBin = beatAudioContext.sampleRate / analyser.fftSize;
      const first = Math.floor(60 / hzPerBin);
      const last = Math.min(
        frequencies.length - 1,
        Math.ceil(220 / hzPerBin)
      );

      let total = 0;
      for (let i = first; i <= last; i++) {
        total += frequencies[i];
      }

      const bass = total / (last - first + 1);
      average = average === 0 ? bass : average * 0.94 + bass * 0.06;

      const hit = Math.min(
        1,
        Math.max(0, (bass - average * 0.85) / (average * 0.55 + 12))
      );

      pulse = Math.max(hit, pulse * 0.84);

      introScreen.style.setProperty(
        "--beat-lift",
        `${-12 * pulse}px`
      );
      introScreen.style.setProperty(
        "--beat-zoom",
        `${1 + 0.045 * pulse}`
      );
      introScreen.style.setProperty(
        "--beat-glow",
        `${18 + 32 * pulse}px`
      );
      introScreen.style.setProperty(
        "--beat-light",
        `${0.25 + 0.5 * pulse}`
      );

      animationFrame = requestAnimationFrame(animateToMusic);
    }

    music.addEventListener("play", function () {
      cancelAnimationFrame(animationFrame);
      average = 0;
      animateToMusic();
    });

    music.addEventListener("pause", function () {
      cancelAnimationFrame(animationFrame);
      pulse = 0;
      introScreen.style.setProperty("--beat-lift", "0px");
      introScreen.style.setProperty("--beat-zoom", "1");
      introScreen.style.setProperty("--beat-light", "0");
    });
  })();
</script>
  <style>
  /* Calm background before the music starts */
  #intro {
    background:
      radial-gradient(ellipse at 50% 70%, rgba(255, 176, 209, 0.20), transparent 42%),
      radial-gradient(circle at 18% 22%, rgba(170, 125, 215, 0.14), transparent 32%),
      radial-gradient(circle at 82% 28%, rgba(255, 155, 190, 0.12), transparent 30%),
      linear-gradient(160deg, #120d1b, #251629 65%, #120d1b);
  }

  #intro::before {
    content: "♡       ✧        ♡       ·       ✧";
    position: absolute;
    top: 16%;
    left: 0;
    width: 100%;
    color: #ffd8e8;
    font-size: clamp(18px, 3vw, 30px);
    letter-spacing: 4vw;
    text-align: center;
    opacity: 0.45;
    pointer-events: none;
    animation: calmFloat 5s ease-in-out infinite alternate;
  }

  @keyframes calmFloat {
    from { transform: translateY(0); opacity: 0.3; }
    to { transform: translateY(-18px); opacity: 0.65; }
  }
</style>
</body>
</html>
