name: Cinta Kita private memories - public publishing disabled
# Private memories stay in Supabase behind member authentication.
# This workflow intentionally never exports memory records to GitHub Pages.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  privacy-check:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Public memory publishing disabled. No Supabase access or export."
