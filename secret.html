<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A little secret for you ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #fff1f5;
      font-family: 'DM Sans', sans-serif;
      background: radial-gradient(circle at 50% 8%, #853f68 0%, #3f203c 42%, #170f20 100%);
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .35;
      background-image: radial-gradient(#fff 1px, transparent 1px);
      background-size: 39px 39px;
    }

    .glow {
      position: fixed;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      filter: blur(60px);
      background: #d25e91;
      opacity: .16;
      pointer-events: none;
    }

    .glow.one { top: -180px; left: -130px; }
    .glow.two { bottom: -190px; right: -120px; }

    .card {
      position: relative;
      width: min(390px, calc(100vw - 32px));
      padding: 34px 27px 28px;
      text-align: center;
      border: 1px solid rgba(255,221,231,.35);
      border-radius: 29px;
      background: rgba(38,20,40,.73);
      box-shadow: 0 25px 70px #0b051066, inset 0 1px #ffffff22;
      backdrop-filter: blur(18px);
    }

    .heart {
      font-size: 42px;
      color: #ffa6c2;
      filter: drop-shadow(0 0 15px #f67da0aa);
      animation: beat 2s ease-in-out infinite;
    }

    h1 {
      margin: 8px 0 6px;
      font: 600 clamp(35px, 9vw, 45px)/1.05 'Cormorant Garamond', Georgia, serif;
    }

    p {
      margin: 0 0 23px;
      color: #f5cad9;
      font-size: 13px;
      letter-spacing: .04em;
    }

    .display {
      display: flex;
      justify-content: center;
      gap: 14px;
      padding: 15px 0 20px;
    }

    .dot {
      width: 15px;
      height: 15px;
      border: 1.5px solid #ffc7d7;
      border-radius: 50%;
      transition: .18s;
    }

    .dot.filled {
      background: #ff9ebd;
      box-shadow: 0 0 13px #fa88af;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-width: 280px;
      margin: auto;
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .key {
      aspect-ratio: 1.38;
      color: #fff4f8;
      font-size: 23px;
      border: 1px solid #ffd0de44;
      border-radius: 18px;
      background: #ffffff12;
      cursor: pointer;
      transition: transform .15s, background .15s;
    }

    .key:hover, .key:focus-visible {
      transform: translateY(-2px);
      background: #fba3c233;
      outline: 2px solid #ffc2d5;
      outline-offset: 2px;
    }

    .key:active { transform: scale(.94); }
    .key.special { font-size: 19px; color: #ffc9da; }

    #message {
      min-height: 20px;
      margin: 21px 0 0;
      font-size: 13px;
      color: #ffd9e4;
    }

    .shake { animation: shake .35s; }

    @keyframes beat {
      50% { transform: scale(1.12); }
    }

    @keyframes shake {
      25% { transform: translateX(-7px); }
      75% { transform: translateX(7px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .heart, .shake { animation: none; }
    }
  </style>
</head>
<body>
  <div class="glow one"></div>
  <div class="glow two"></div>

  <main class="card" id="card">
    <div class="heart" aria-hidden="true">♥</div>
    <h1>A little secret for you</h1>
    <p>Enter our four special numbers ♡</p>

    <div class="display" aria-label="PIN entry, zero of four digits entered" id="display">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

    <div class="keys" aria-label="PIN keypad">
      <button class="key" type="button" data-key="1">1</button>
      <button class="key" type="button" data-key="2">2</button>
      <button class="key" type="button" data-key="3">3</button>
      <button class="key" type="button" data-key="4">4</button>
      <button class="key" type="button" data-key="5">5</button>
      <button class="key" type="button" data-key="6">6</button>
      <button class="key" type="button" data-key="7">7</button>
      <button class="key" type="button" data-key="8">8</button>
      <button class="key" type="button" data-key="9">9</button>
      <button class="key special" type="button" data-key="clear" aria-label="Clear PIN">C</button>
      <button class="key" type="button" data-key="0">0</button>
      <button class="key special" type="button" data-key="delete" aria-label="Delete last digit">⌫</button>
    </div>

    <div id="message" role="status" aria-live="polite"></div>
  </main>

  <script>
    const pin = '0203';
    let entered = '';

    const card = document.getElementById('card');
    const dots = [...document.querySelectorAll('.dot')];
    const display = document.getElementById('display');
    const message = document.getElementById('message');

    function update() {
      dots.forEach((dot, index) => dot.classList.toggle('filled', index < entered.length));
      display.setAttribute('aria-label', `PIN entry, ${entered.length} of four digits entered`);
    }

    function press(key) {
      if (key === 'clear') entered = '';
      else if (key === 'delete') entered = entered.slice(0, -1);
      else if (/^[0-9]$/.test(key) && entered.length < 4) entered += key;

      message.textContent = '';
      update();

      if (entered.length === 4) {
        if (entered === pin) {
          message.textContent = 'You found our little world ♡';
          setTimeout(() => { window.location.href = './'; }, 850);
        } else {
          message.textContent = 'Not quite. Try again ♡';
          card.classList.remove('shake');
          void card.offsetWidth;
          card.classList.add('shake');
          setTimeout(() => { entered = ''; update(); }, 550);
        }
      }
    }

    document.querySelectorAll('[data-key]').forEach(button =>
      button.addEventListener('click', () => press(button.dataset.key))
    );

    document.addEventListener('keydown', event => {
      if (/^[0-9]$/.test(event.key)) press(event.key);
      if (event.key === 'Backspace') press('delete');
      if (event.key === 'Escape') press('clear');
    });
  </script>
</body>
</html>
