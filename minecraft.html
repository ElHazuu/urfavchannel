<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#201520">
<title>Our Minecraft World · Cinta Kita</title>
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--accent:#f4aeca;--ink:#fff3f8;--sub:#d9bfcf;--panel:rgba(35,24,39,.89);--line:rgba(240,189,209,.35);--shade:#140e1d}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:"DM Sans",Arial,sans-serif;color:var(--ink);background:var(--shade)}
body{overflow:hidden;background:radial-gradient(ellipse at 15% 0%,#57334a 0,transparent 45%),radial-gradient(ellipse at 100% 80%,#29233a 0,transparent 48%),#140e1d}
button,a{font:inherit;-webkit-tap-highlight-color:transparent}button{cursor:pointer}a{text-decoration:none;color:inherit}
.top{height:83px;position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px clamp(12px,3vw,34px);background:var(--panel);border-bottom:1px solid var(--line);box-shadow:0 12px 35px #08050b66;backdrop-filter:blur(20px)}
.brand{display:flex;gap:12px;align-items:center;min-width:0}.mark{width:43px;height:43px;border-radius:15px;border:1px solid var(--line);display:grid;place-items:center;color:var(--accent);background:rgba(255,255,255,.06)}.mark svg{width:23px;height:23px}
.eyebrow{color:var(--accent);font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.brand h1{font:600 clamp(23px,3vw,31px)/1.05 "Cormorant Garamond",Georgia,serif;margin:2px 0 0;white-space:nowrap}
.actions{display:flex;align-items:center;gap:9px}.pill{border:1px solid var(--line);background:rgba(255,255,255,.055);color:var(--ink);border-radius:30px;padding:10px 14px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .18s,transform .18s,border-color .18s;white-space:nowrap}
.pill:hover{background:rgba(244,174,202,.17);border-color:var(--accent);transform:translateY(-1px)}.pill svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.8}
.mapwrap{position:absolute;inset:83px 0 0;padding:14px;display:flex;flex-direction:column;gap:10px}
.mapframe{position:relative;flex:1;min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:23px;background:#10151d;box-shadow:0 16px 45px #05020888}
iframe{display:block;width:100%;height:100%;border:0;background:#10151d}
.corner{position:absolute;top:16px;left:16px;z-index:2;pointer-events:none;max-width:calc(100% - 32px);padding:12px 17px;border:1px solid var(--line);border-radius:17px;background:var(--panel);backdrop-filter:blur(18px);box-shadow:0 8px 28px #0006}
.corner h2{font:600 23px/1.05 "Cormorant Garamond",serif;margin:4px 0}.corner p{font-size:11px;color:var(--sub);margin:4px 0 0}
.footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 5px 2px;font-size:11px;color:var(--sub)}
.footer b{font-weight:600;color:var(--accent)}
#fullscreen:fullscreen{padding:0;border:0;border-radius:0}#fullscreen:fullscreen iframe{height:100%}
@media(max-width:640px){.top{height:72px;padding:10px}.brand h1{font-size:22px}.eyebrow{font-size:9px}.mark{width:37px;height:37px;border-radius:13px}.actions{gap:5px}.pill{padding:10px;min-width:36px}.pill .txt{display:none}.mapwrap{inset:72px 0 0;padding:7px}.mapframe{border-radius:15px}.corner{padding:8px 12px;top:9px;left:9px}.corner h2{font-size:19px}.footer{font-size:10px}}
@media(prefers-reduced-motion:reduce){.pill{transition:none}}
</style>
</head>
<body>
<header class="top">
 <div class="brand">
  <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15m6-12v15"/><circle cx="15" cy="11" r="2"/></svg></span>
  <div><div class="eyebrow">Cinta Kita · World Explorer</div><h1>Our Minecraft World</h1></div>
 </div>
 <nav class="actions" aria-label="Map navigation">
  <a href="./" class="pill" title="Return to Cinta Kita"><svg viewBox="0 0 24 24"><path d="m14 18-6-6 6-6"/></svg><span class="txt">Cinta Kita</span></a>
  <a href="bluemap-offline/web/" target="_blank" rel="noopener" class="pill" title="Open BlueMap directly"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/><path d="M20 13v7H4V4h7"/></svg><span class="txt">Open map</span></a>
  <button class="pill" id="expand" title="Fullscreen map" aria-label="Toggle fullscreen"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg><span class="txt">Fullscreen</span></button>
 </nav>
</header>
<main class="mapwrap">
 <section class="mapframe" id="fullscreen" aria-label="Minecraft map viewer">
  <iframe src="bluemap-offline/web/" title="3D Minecraft world map" allowfullscreen loading="eager"></iframe>
  <div class="corner"><div class="eyebrow">Saved 3D world</div><h2>Our little universe ♡</h2><p>Explore our homes, adventures &amp; memories.</p></div>
 </section>
 <div class="footer"><span><b>BlueMap</b> · Last published world snapshot</span><span>Updates after your next successful GitHub sync</span></div>
</main>
<script>
const expand=document.getElementById('expand');
const frame=document.getElementById('fullscreen');
expand.addEventListener('click',async()=>{
 try{if(document.fullscreenElement){await document.exitFullscreen()}else{await frame.requestFullscreen()}}
 catch(e){console.warn('Fullscreen not available',e)}
});
</script>
</body>
</html>
