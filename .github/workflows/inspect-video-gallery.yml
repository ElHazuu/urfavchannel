name: Inspect main-site video components
on:
  push:
    paths:
      - '.github/workflows/inspect-video-gallery.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show video component context
        shell: python
        run: |
          import re
          from pathlib import Path
          rows=Path("index.html").read_text(encoding="utf-8").splitlines()
          matches=[i for i,l in enumerate(rows) if re.search(r'our story|storySection|storyGrid|storyPhoto|storyCard|siamese|sittingKitten|storyHeading|A place for our story',l,re.I)]
          print("TOTAL_LINES",len(rows),"TOTAL_MATCHES",len(matches))
          seen=set()
          for i in matches[:100]:
            for j in range(max(0,i-2),min(len(rows),i+5)):
              if j not in seen:
                print(f"L{j+1}: {rows[j][:700]}")
                seen.add(j)
