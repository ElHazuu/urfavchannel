<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Our Minecraft World | Cinta Kita</title>
<meta name="theme-color" content="#211923">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#f3b5d5;--text:#fff6fa;--line:#d59fbd85;--glass:#241725ea;--shade:#130e16;--btn:#473449ed;--btnhover:#70506f;--glow:#ffcde75c}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#09090c;color:var(--text);font-family:'DM Sans','Segoe UI',Arial,sans-serif;overflow:hidden}button,a{font:inherit;color:inherit}a{text-decoration:none}
.map{position:fixed;inset:0;background:#10151b}.map iframe{height:100%;width:100%;border:0;display:block}
/* Compact toolbar only. No giant overlay over the actual world. */
.toolbar{position:fixed;top:13px;left:50%;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:10px;max-width:calc(100vw - 20px);padding:9px 12px;border:1px solid var(--line);border-radius:17px;background:var(--glass);box-shadow:0 9px 32px #000b;backdrop-filter:blur(16px)}
.brand{display:flex;align-items:center;gap:9px;padding-right:11px;border-right:1px solid var(--line);white-space:nowrap}.brand .cube{font-size:20px}.brand b{font-size:12px;letter-spacing:.01em}.brand small{display:block;color:var(--pink);font-size:9px;letter-spacing:.13em;text-transform:uppercase}
.group{display:flex;align-items:center;gap:7px}.pixel{min-height:37px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 12px;background:var(--btn);border:1px solid var(--line);border-radius:8px;box-shadow:inset 0 2px #ffffff1d,inset 0 -3px #09050b50,0 3px 0 #0b090df0;font-size:11px;font-weight:700;cursor:pointer;text-shadow:0 1px #0007;white-space:nowrap;transition:translate .18s,background .18s,box-shadow .18s,filter .18s}
.pixel:hover{translate:0 -3px;background:var(--btnhover);filter:brightness(1.15);box-shadow:inset 0 2px #ffffff33,inset 0 -3px #09050b50,0 6px 0 #0b090df0,0 0 17px var(--glow)}.pixel:active{translate:0 1px;box-shadow:inset 0 2px #ffffff20,0 1px 0 #0b090df0}.pixel:focus-visible{outline:2px solid #ffdcef;outline-offset:3px}.pixel svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

@media(max-width:700px){.toolbar{top:9px;padding:7px;gap:5px}.brand{border:0;padding:0 5px}.brand b{font-size:11px}.brand small{display:none}.brand .cube{font-size:16px}.pixel{min-height:35px;padding:7px 9px}.pixel .label{display:none}}
@media(prefers-reduced-motion:reduce){.pixel{transition:none}}

/* Smooth, unobtrusive environmental colors with no picker. */
[hidden]{display:none!important}
.toolbar,.pixel{transition:background-color .75s ease,border-color .75s ease,box-shadow .35s ease,translate .18s,filter .18s}
@media(prefers-reduced-motion:reduce){.toolbar,.pixel{transition:none}}
.sync-indicator{display:flex;align-items:center;gap:6px;max-width:220px;color:var(--text);font-size:10px;line-height:1.25;padding:6px 9px;background:var(--btn);border:1px solid var(--line);border-radius:9px;white-space:nowrap}
.sync-indicator svg{width:14px;height:14px;fill:none;stroke:var(--pink);stroke-width:2;flex:none}
.sync-indicator span{overflow:hidden;text-overflow:ellipsis}
@media(max-width:700px){.sync-indicator{max-width:125px;font-size:9px;padding:6px}.sync-indicator svg{display:none}}

/* Minecraft / Dynmap-inspired stone UI: deliberately pixel-edged, not rounded glass. */
@import url('https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap');
.toolbar,.toolbar button,.toolbar a,.sync-indicator,#show{font-family:'Pixelify Sans','Trebuchet MS',sans-serif!important;letter-spacing:.02em}
.toolbar{top:10px;padding:7px 9px;gap:8px;border:3px solid #10191a!important;border-radius:2px!important;background:linear-gradient(#50615c,#293630)!important;box-shadow:inset 2px 2px 0 #85978b,inset -2px -2px 0 #192a26,0 4px 0 #0a1513,0 8px 20px #0009!important;backdrop-filter:none}
.brand{padding-right:10px;border-right:2px solid #14241d}.brand b{font-size:15px!important;font-weight:700;line-height:1.05;text-shadow:2px 2px #0c1915}.brand small{color:#c7e5a3;font-size:10px!important;font-weight:700;letter-spacing:.12em}.brand .cube{filter:drop-shadow(2px 2px #12241e)}
.toolbar .pixel,#show{border:2px solid #19251e!important;border-radius:2px!important;background:linear-gradient(#73816a,#4e5f50)!important;color:#f3f4e9!important;min-height:35px;padding:6px 10px;font-size:13px!important;font-weight:700;box-shadow:inset 2px 2px 0 #a4af96,inset -2px -2px 0 #334535,0 3px 0 #141f17!important;text-shadow:1px 2px #243729;transition:filter .12s,transform .12s!important}
.toolbar .pixel:hover,#show:hover{background:linear-gradient(#9dac83,#657e57)!important;filter:brightness(1.08);transform:translateY(-2px);box-shadow:inset 2px 2px 0 #c6d8af,inset -2px -2px 0 #36503c,0 5px 0 #141f17!important}
.toolbar .pixel:active,#show:active{transform:translateY(2px);box-shadow:inset 1px 1px 0 #334535!important}
.sync-indicator{max-width:230px;font-size:12px!important;background:#243a31!important;border:2px solid #17251c!important;border-radius:2px!important;padding:7px 9px;color:#e4f3dd;box-shadow:inset 1px 1px 0 #748d76,inset -1px -1px 0 #0d1e15}
.sync-indicator svg{stroke:#b3d7a4}.toolbar .group{gap:5px}
@media(max-width:700px){.toolbar{gap:4px;padding:5px}.toolbar .pixel{min-height:32px;padding:5px 8px}.brand b{font-size:12px!important}.sync-indicator{font-size:10px!important}}

</style>
</head>
<body>
<main class="map" id="map"><iframe src="bluemap-offline/web/?ckmemory=v4" title="Our Minecraft world BlueMap" allowfullscreen></iframe></main>
<nav class="toolbar" aria-label="Minecraft world map controls">
 <span class="brand"><span class="cube" aria-hidden="true">🗺️</span><span><small>Cinta Kita</small><b>Our Minecraft World</b></span></span>
 <span class="sync-indicator" id="syncIndicator" title="Date of the last published offline BlueMap snapshot"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="syncText" aria-live="polite">Map update: checking…</span></span>
 <div class="group">
  <a class="pixel" href="./?fromMap=1#home" aria-label="Return straight to the main Cinta Kita website" title="Return to the main Cinta Kita website"><svg viewBox="0 0 24 24"><path d="m14 5-7 7 7 7M7 12h14"/></svg><span class="label">Cinta Kita</span></a>
  <button class="pixel" id="full" type="button" title="Fullscreen map" aria-label="Toggle fullscreen"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg><span class="label">Fullscreen</span></button>
  <button class="pixel" id="hide" type="button" title="Hide toolbar to see more map" aria-label="Hide toolbar"><svg viewBox="0 0 24 24"><path d="M3 12s4-7 9-7 9 7 9 7-4 7-9 7-9-7-9-7Z"/><circle cx="12" cy="12" r="3"/></svg><span class="label">Hide UI</span></button>
 </div>
</nav>
<button type="button" class="pixel" id="show" style="display:none;position:fixed;z-index:21;top:12px;left:12px" title="Show toolbar">☰ <span>Show controls</span></button>
<script>
// Reads the timestamp written by the BlueMap uploader into the same snapshot commit.
async function loadLastUpdate(){
 const el=document.getElementById('syncText');
 try{
  const res=await fetch('bluemap-offline/web/cinta-kita-sync.json?t='+Date.now(),{cache:'no-store'});
  if(!res.ok)throw new Error('No published timestamp');
  const obj=await res.json();
  if(!obj.publishedSnapshotAt || Number.isNaN(Date.parse(obj.publishedSnapshotAt)))throw new Error('Invalid timestamp');
  const d=new Date(obj.publishedSnapshotAt);
  el.textContent='Updated '+new Intl.DateTimeFormat(undefined,{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(d);
  document.getElementById('syncIndicator').title='Last published map snapshot: '+d.toLocaleString();
 }catch(e){
  el.textContent='Update time unavailable';
 }
}
loadLastUpdate();
const bar=document.querySelector('.toolbar'),hide=document.getElementById('hide'),show=document.getElementById('show');
const mapFrame=document.querySelector('.map iframe');
let mapControlsVisible=true;
// Control the same-origin BlueMap iframe directly: independent of cached/auto-synced BlueMap JS.
function syncMemoryControls(){
 try{
  const doc=mapFrame.contentDocument;
  if(!doc?.head)return;
  let sheet=doc.getElementById('ck-parent-control-layout');
  if(!sheet){
   sheet=doc.createElement('style');sheet.id='ck-parent-control-layout';
   sheet.textContent=`
    @import url('https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap');
    #ck-memory-controls,#ck-memory-controls button,#ck-supabase-status{font-family:'Pixelify Sans','Trebuchet MS',sans-serif!important;font-weight:600!important;letter-spacing:.025em!important}
    #ck-memory-controls{gap:8px!important;bottom:65px!important}
    #ck-memory-controls .ck-m-button{
      min-width:158px!important;min-height:37px!important;padding:7px 12px!important;text-align:left!important;
      border:2px solid #192a20!important;border-radius:2px!important;color:#f0f5e6!important;
      background:linear-gradient(#6c8063,#435945)!important;font-size:15px!important;
      box-shadow:inset 2px 2px 0 #adc19b,inset -2px -2px 0 #243c2e,0 4px 0 #112219,0 6px 12px #0008!important;
      text-shadow:1px 2px #213528!important;transform:none!important;transition:filter .15s,translate .15s!important
    }
    #ck-memory-controls .ck-m-button:hover{background:linear-gradient(#a2b78c,#698359)!important;translate:0 -2px!important;filter:brightness(1.04)}
    #ck-memory-controls .ck-m-button:active{translate:0 2px!important;box-shadow:inset 2px 2px 0 #243c2e!important}
    #ck-supabase-status{border:2px solid #1b3828!important;border-radius:2px!important;color:#d1edbc!important;background:linear-gradient(#374e3e,#21362e)!important;box-shadow:inset 1px 1px 0 #748d6b,0 4px 0 #102219!important;font-size:13px!important;padding:8px 10px!important}
    #ck-m-status{font-family:'Pixelify Sans','Trebuchet MS',sans-serif!important;font-size:13px!important;color:#f5eabb!important}

    #ck-memory-controls{left:16px!important;right:auto!important;align-items:flex-start!important;text-align:left!important}
    #ck-m-status{text-align:left!important}
    #ck-supabase-status{left:16px!important;right:auto!important;bottom:175px!important}
    html.ck-parent-hide-memory-ui #ck-memory-controls,
    html.ck-parent-hide-memory-ui #ck-supabase-status{display:none!important}
   `;
   doc.head.append(sheet);
  }
  doc.documentElement.classList.toggle('ck-parent-hide-memory-ui',!mapControlsVisible);
 }catch(err){console.warn('[Cinta Kita] Cannot sync iframe controls',err)}
}
function setMapControlsVisible(visible){
 mapControlsVisible=visible;
 bar.style.display=visible?'flex':'none';
 show.style.display=visible?'none':'inline-flex';
 syncMemoryControls();
 // Keep compatibility with the current BlueMap script.
 if(mapFrame.contentWindow)mapFrame.contentWindow.postMessage({type:'ck-map-ui-visibility',visible},location.origin);
}
hide.addEventListener('click',()=>setMapControlsVisible(false));
show.addEventListener('click',()=>setMapControlsVisible(true));
mapFrame.addEventListener('load',()=>{syncMemoryControls();setTimeout(syncMemoryControls,1000)});
setInterval(syncMemoryControls,2500);
syncMemoryControls();
document.getElementById('full').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.getElementById('map').requestFullscreen()}catch(e){console.warn('Fullscreen failed',e)}});

// Automatic ambient UI coloration. This is a visual color estimate, not true biome metadata.
// The website and BlueMap are hosted on the same GitHub Pages origin, which may allow
// sampling BlueMap's WebGL canvas. Browser security/WebGL settings can still block it.
const root=document.documentElement;
const themes={
  default:'#bc8caf', water:'#377fa8', deepwater:'#24527c', warmwater:'#28a7aa',
  forest:'#4b855c', darkforest:'#365645', jungle:'#23845a',
  pale:'#a7afac', cherry:'#daa3bc', autumn:'#bb874c',
  desert:'#cbae78', badlands:'#b16c51', grass:'#8caf70',
  snow:'#b4d6e2', stone:'#848c92', cave:'#6e7480', nether:'#a34d50',
  end:'#a7a17e'
};
let current='default';
function hexRgb(s){return [1,3,5].map(i=>parseInt(s.slice(i,i+2),16))}
function scale(hex,x){return '#'+hexRgb(hex).map(c=>Math.max(0,Math.min(255,Math.round(c*x))).toString(16).padStart(2,'0')).join('')}
function applyAmbient(name){
  if(name===current)return;
  current=name;
  const h=themes[name]||themes.default;
  root.style.setProperty('--pink',scale(h,1.35));
  root.style.setProperty('--line',h+'a5');
  root.style.setProperty('--glass',scale(h,.26)+'eb');
  root.style.setProperty('--btn',scale(h,.46)+'ed');
  root.style.setProperty('--btnhover',scale(h,.72));
  root.style.setProperty('--glow',h+'70');
}
function pixelCategory(r,g,b){
  const max=Math.max(r,g,b), min=Math.min(r,g,b);
  if(max<42)return null;
  // Hue/lightness clues from the *visible rendered terrain*, not actual biome IDs.
  if(b>r*1.15 && b>g*1.06 && b>65)return b<105?'deepwater':'water';
  if(g>r*1.19 && g>b*1.08){
    if(g<86)return 'darkforest';
    return g>135?'grass':'forest';
  }
  if(r>140 && g>120 && b>118 && Math.max(r,g,b)-Math.min(r,g,b)<26)return 'pale';
  if(r>130 && b>110 && r>g*1.18 && b>g*1.10)return 'cherry';
  if(r>105 && g>68 && b<g*.75){
    if(r>g*1.25)return 'badlands';
    return r>145?'desert':'autumn';
  }
  if(r>155 && g>175 && b>175)return 'snow';
  if(max-min<27 && max>67)return 'stone';
  return null;
}
const sample=document.createElement('canvas');sample.width=56;sample.height=32;
const ctx=sample.getContext('2d',{willReadFrequently:true});
let candidate='', candidateCount=0;
function sampleTerrain(){
  if(!ctx || document.hidden)return;
  try{
    const doc=document.querySelector('.map iframe')?.contentDocument;
    if(!doc)return;
    const canvases=Array.from(doc.querySelectorAll('canvas')).filter(c=>c.width>180&&c.height>120);
    const source=canvases.sort((a,b)=>b.width*b.height-a.width*a.height)[0];
    if(!source)return;
    // Only the map's middle region: ignore menus, sky/edges and most UI elements.
    ctx.clearRect(0,0,56,32);
    ctx.drawImage(source,source.width*.34,source.height*.32,source.width*.32,source.height*.36,0,0,56,32);
    const a=ctx.getImageData(0,0,56,32).data;
    const counts={};let usable=0;
    for(let i=0;i<a.length;i+=4){
      if(a[i+3]<230)continue;
      const type=pixelCategory(a[i],a[i+1],a[i+2]);
      if(type){counts[type]=(counts[type]||0)+1;usable++}
    }
    if(usable<70)return;
    const ranked=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
    if(!ranked.length || ranked[0][1]/usable<.36)return;
    let next=ranked[0][0];
    // Require stability before changing to prevent flickering while panning.
    if(next===candidate)candidateCount++;else{candidate=next;candidateCount=1}
    if(candidateCount>=2)applyAmbient(next);
  }catch(e){
    // Browsers may disallow sampling a WebGL canvas or iframe.
    // Keep the default styling rather than pretending the biome was detected.
  }
}
setInterval(sampleTerrain,2500);
document.querySelector('.map iframe').addEventListener('load',()=>setTimeout(sampleTerrain,1200));
</script>
</body></html>
