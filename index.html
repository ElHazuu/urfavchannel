<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Place</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
      overflow-x: hidden;
    }

    /* INTRO SCREEN */
    #intro {
      position: fixed;
      inset: 0;
      background: black;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 1s ease;
    }

    #cats {
      display: flex;
      align-items: flex-end;
      position: relative;
      padding: 0;
      border: 0;
      background: none;
      color: white;
      cursor: pointer;
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    .cat {
      position: relative;
      width: clamp(145px, 27vw, 210px);
      height: clamp(195px, 37vw, 280px);
      transition: transform 0.65s ease-in-out;
    }

    /* Crops the empty transparent space around each cat. */
    .cat img {
      position: absolute;
      width: 285%;
      max-width: none;
      left: -93%;
      top: -48%;
      pointer-events: none;
      user-select: none;
    }

    .gray {
      transform-origin: 70% 90%;
    }

    .cream {
      transform-origin: 30% 90%;
    }

    #cats.kissing .gray {
      transform: translateX(13%) rotate(9deg);
    }

    #cats.kissing .cream {
      transform: translateX(-13%) rotate(-9deg);
    }

    #cats.disappear {
      transform: scale(0.2) rotate(15deg);
      opacity: 0;
    }

    .heart {
      position: absolute;
      left: 50%;
      top: 12%;
      font-size: 48px;
      opacity: 0;
      transform: translate(-50%, 15px) scale(0.5);
      pointer-events: none;
    }

    #cats.kissing .heart {
      animation: heartPop 1.2s 0.35s ease-out forwards;
    }

    @keyframes heartPop {
      0% {
        opacity: 0;
        transform: translate(-50%, 15px) scale(0.5);
      }

      35% {
        opacity: 1;
        transform: translate(-50%, -15px) scale(1.2);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -75px) scale(1);
      }
    }

    #introText {
      margin-top: 20px;
      font-size: 18px;
      letter-spacing: 2px;
      opacity: 0.7;
      transition: opacity 0.5s ease;
    }

    /* MAIN WEBSITE */
    #mainWebsite {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 1.5s ease, transform 1.5s ease;
      padding: 30px;
    }

    #mainWebsite.show {
      opacity: 1;
      transform: translateY(0);
    }

    h1 {
      font-size: clamp(40px, 8vw, 90px);
      margin: 0 0 10px;
    }

    p {
      font-size: 18px;
      opacity: 0.75;
    }
  </style>
</head>

<body>

  <!-- INTRO -->
  <div id="intro">
    <button id="cats" aria-label="Make the cats kiss and enter the website">
      <span class="cat gray">
        <img src="Cat Waving(1).png" alt="">
      </span>

      <span class="cat cream">
        <img src="Female Cat(6).png" alt="">
      </span>

      <span class="heart">💗</span>
    </button>

    <div id="introText">click us ♡</div>
  </div>

  <!-- MAIN WEBSITE -->
  <main id="mainWebsite">
    <h1>Welcome ❤️</h1>
    <p>A little place made just for you.</p>
  </main>

  <script>
    const cats = document.getElementById("cats");
    const intro = document.getElementById("intro");
    const mainWebsite = document.getElementById("mainWebsite");
    const introText = document.getElementById("introText");

    cats.addEventListener("click", function () {
      if (cats.classList.contains("kissing")) return;

      introText.style.opacity = "0";
      cats.classList.add("kissing");

      setTimeout(function () {
        cats.classList.add("disappear");
      }, 1500);

      setTimeout(function () {
        intro.style.opacity = "0";
        mainWebsite.classList.add("show");
      }, 2100);

      setTimeout(function () {
        intro.style.display = "none";
      }, 3100);
    });
  </script>

</body>
</html>
