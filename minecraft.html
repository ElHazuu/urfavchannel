<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Our Minecraft World | Cinta Kita</title>
<meta name="theme-color" content="#211923">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#f3b5d5;--text:#fff6fa;--line:#d59fbd85;--glass:#241725ea;--shade:#130e16;--btn:#473449ed;--btnhover:#70506f;--glow:#ffcde75c}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#09090c;color:var(--text);font-family:'DM Sans','Segoe UI',Arial,sans-serif;overflow:hidden}button,a{font:inherit;color:inherit}a{text-decoration:none}
.map{position:fixed;inset:0;background:#10151b}.map iframe{height:100%;width:100%;border:0;display:block}
/* Compact toolbar only. No giant overlay over the actual world. */
.toolbar{position:fixed;top:13px;left:50%;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:10px;max-width:calc(100vw - 20px);padding:9px 12px;border:1px solid var(--line);border-radius:17px;background:var(--glass);box-shadow:0 9px 32px #000b;backdrop-filter:blur(16px)}
.brand{display:flex;align-items:center;gap:9px;padding-right:11px;border-right:1px solid var(--line);white-space:nowrap}.brand .cube{font-size:20px}.brand b{font-size:12px;letter-spacing:.01em}.brand small{display:block;color:var(--pink);font-size:9px;letter-spacing:.13em;text-transform:uppercase}
.group{display:flex;align-items:center;gap:7px}.pixel{min-height:37px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 12px;background:var(--btn);border:1px solid var(--line);border-radius:8px;box-shadow:inset 0 2px #ffffff1d,inset 0 -3px #09050b50,0 3px 0 #0b090df0;font-size:11px;font-weight:700;cursor:pointer;text-shadow:0 1px #0007;white-space:nowrap;transition:translate .18s,background .18s,box-shadow .18s,filter .18s}
.pixel:hover{translate:0 -3px;background:var(--btnhover);filter:brightness(1.15);box-shadow:inset 0 2px #ffffff33,inset 0 -3px #09050b50,0 6px 0 #0b090df0,0 0 17px var(--glow)}.pixel:active{translate:0 1px;box-shadow:inset 0 2px #ffffff20,0 1px 0 #0b090df0}.pixel:focus-visible{outline:2px solid #ffdcef;outline-offset:3px}.pixel svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

@media(max-width:700px){.toolbar{top:9px;padding:7px;gap:5px}.brand{border:0;padding:0 5px}.brand b{font-size:11px}.brand small{display:none}.brand .cube{font-size:16px}.pixel{min-height:35px;padding:7px 9px}.pixel .label{display:none}}
@media(prefers-reduced-motion:reduce){.pixel{transition:none}}

/* Palette drawer remains independent of BlueMap's WebGL viewer. */
[hidden]{display:none!important}.biome-drawer{position:fixed;top:82px;right:14px;bottom:18px;width:min(350px,calc(100vw - 28px));z-index:30;display:flex;flex-direction:column;gap:12px;padding:15px;border-radius:17px;background:var(--glass);border:1px solid var(--line);box-shadow:0 18px 48px #000d;backdrop-filter:blur(21px)}
.drawer-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.drawer-head b{display:block;font-size:15px}.drawer-head small{display:block;margin-top:4px;color:var(--pink);font-size:11px}.close{width:32px;height:32px;border:1px solid var(--line);border-radius:9px;background:var(--btn);cursor:pointer;color:white;font-size:22px}.search-label{font-size:11px;opacity:.9}.biome-drawer input{background:#130e18be;border:1px solid var(--line);border-radius:9px;padding:11px;color:#fff;outline:0;width:100%}.biome-drawer input:focus{border-color:var(--pink)}.biome-list{overflow:auto;min-height:0;flex:1;display:grid;grid-template-columns:1fr 1fr;align-content:start;gap:7px;padding-right:3px}.biome-list h3{grid-column:1/-1;margin:12px 0 0;font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--pink)}.biome-choice{display:flex;align-items:center;gap:8px;min-height:45px;text-align:left;border:1px solid var(--line);background:#ffffff10;border-radius:9px;color:var(--text);font-size:11px;cursor:pointer;padding:7px;transition:background .2s,border-color .2s,transform .2s}.biome-choice:hover{background:#ffffff27;transform:translateY(-2px);border-color:var(--pink)}.biome-choice[aria-pressed="true"]{border:2px solid var(--pink);background:#ffffff2a}.swatch{flex:none;width:20px;height:20px;border-radius:6px;border:1px solid #fff9;box-shadow:inset 0 0 0 2px #0002}.drawer-foot{font-size:10px;line-height:1.5;color:#eee4ecaf;border-top:1px solid var(--line);padding-top:9px}html{transition:background-color .65s}.toolbar,.pixel,.biome-drawer{transition:background-color .65s,border-color .65s,box-shadow .35s} @media(max-width:700px){.biome-drawer{top:66px;bottom:9px;right:8px}}
</style>
</head>
<body>
<main class="map" id="map"><iframe src="bluemap-offline/web/" title="Our Minecraft world BlueMap" allowfullscreen></iframe></main>
<nav class="toolbar" aria-label="Minecraft world map controls">
 <span class="brand"><span class="cube" aria-hidden="true">🗺️</span><span><small>Cinta Kita</small><b>Our Minecraft World</b></span></span>
 <div class="group">
  <a class="pixel" href="./?fromMap=1#home" aria-label="Return straight to the main Cinta Kita website" title="Return to the main Cinta Kita website"><svg viewBox="0 0 24 24"><path d="m14 5-7 7 7 7M7 12h14"/></svg><span class="label">Cinta Kita</span></a>
  <button class="pixel" id="full" type="button" title="Fullscreen map" aria-label="Toggle fullscreen"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg><span class="label">Fullscreen</span></button>
  <button class="pixel" id="biome" type="button" title="Choose a biome color" aria-label="Choose biome color"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-2-1-3-3-3h-2a2 2 0 0 1-2-2c0-1 1-2 1-3 0-1-1-1-3-1Z"/><circle cx="7.5" cy="11" r="1"/><circle cx="11" cy="7.5" r="1"/></svg><span class="label" id="biomeLabel">Biome colors</span></button>
  <button class="pixel" id="hide" type="button" title="Hide toolbar to see more map" aria-label="Hide toolbar"><svg viewBox="0 0 24 24"><path d="M3 12s4-7 9-7 9 7 9 7-4 7-9 7-9-7-9-7Z"/><circle cx="12" cy="12" r="3"/></svg><span class="label">Hide UI</span></button>
 </div>
</nav>
<button type="button" class="pixel" id="show" style="display:none;position:fixed;z-index:21;top:12px;left:12px" title="Show toolbar">☰ <span>Show controls</span></button>
<aside class="biome-drawer" id="biomeDrawer" hidden aria-label="Biome color palette picker">
 <div class="drawer-head"><div><b>Biome colors</b><small>Choose a Minecraft biome palette</small></div><button class="close" id="closeBiomes" aria-label="Close biome colors">×</button></div>
 <label class="search-label" for="biomeSearch">Search biomes</label>
 <input id="biomeSearch" type="search" placeholder="e.g. Pale Garden, Dappled Forest" autocomplete="off">
 <div class="biome-list" id="biomeList"></div>
 <div class="drawer-foot" id="biomeNote">Manual selection: exact biome tracking needs Minecraft biome data.</div>
</aside>
<script>
const bar=document.querySelector('.toolbar'),hide=document.getElementById('hide'),show=document.getElementById('show');
hide.addEventListener('click',()=>{bar.style.display='none';show.style.display='inline-flex'});
show.addEventListener('click',()=>{bar.style.display='flex';show.style.display='none'});
document.getElementById('full').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.getElementById('map').requestFullscreen()}catch(e){console.warn('Fullscreen failed',e)}});

// Full vanilla 26.3 palette selection, no biome-location detection implied.

const BIOMES={"Overworld · Fields & Forests": [["Plains", "#9aba7a"], ["Sunflower Plains", "#e2c761"], ["Meadow", "#a7ba70"], ["Forest", "#498558"], ["Flower Forest", "#b57ca5"], ["Birch Forest", "#b3c686"], ["Old Growth Birch Forest", "#849d63"], ["Dark Forest", "#344e42"], ["Pale Garden", "#a8aca5"], ["Dappled Forest", "#c78948"], ["Cherry Grove", "#e9acc9"], ["Taiga", "#537c73"], ["Snowy Taiga", "#9ab6ae"], ["Old Growth Pine Taiga", "#53715c"], ["Old Growth Spruce Taiga", "#3e6962"], ["Jungle", "#288253"], ["Sparse Jungle", "#76a56c"], ["Bamboo Jungle", "#639c54"], ["Swamp", "#687a56"], ["Mangrove Swamp", "#666b47"], ["Mushroom Fields", "#ad7bb1"]], "Overworld · Warm & Dry": [["Desert", "#e1c784"], ["Savanna", "#baa865"], ["Savanna Plateau", "#a9995c"], ["Windswept Savanna", "#b4a36c"], ["Badlands", "#c47454"], ["Eroded Badlands", "#ad624b"], ["Wooded Badlands", "#aa7351"]], "Overworld · Mountains & Coasts": [["Windswept Hills", "#85968b"], ["Windswept Gravelly Hills", "#939693"], ["Windswept Forest", "#639075"], ["Stony Peaks", "#9d9891"], ["Jagged Peaks", "#9db0bb"], ["Frozen Peaks", "#b1d8e7"], ["Snowy Slopes", "#c3ddec"], ["Grove", "#92b6a4"], ["Snowy Plains", "#c5deeb"], ["Ice Spikes", "#99d4ea"], ["Beach", "#e7cd90"], ["Snowy Beach", "#cad8d7"], ["Stony Shore", "#99988e"], ["River", "#478eaa"], ["Frozen River", "#9fcbda"]], "Overworld · Oceans": [["Ocean", "#468cae"], ["Deep Ocean", "#286386"], ["Cold Ocean", "#5b90a7"], ["Deep Cold Ocean", "#3d6b88"], ["Frozen Ocean", "#9cc7d9"], ["Deep Frozen Ocean", "#6d9baf"], ["Lukewarm Ocean", "#419baf"], ["Deep Lukewarm Ocean", "#28798e"], ["Warm Ocean", "#31a9b9"]], "Underground": [["Lush Caves", "#59ab6c"], ["Dripstone Caves", "#9f856c"], ["Deep Dark", "#284755"]], "Nether": [["Nether Wastes", "#a64c4b"], ["Crimson Forest", "#a22947"], ["Warped Forest", "#329b98"], ["Soul Sand Valley", "#7f7366"], ["Basalt Deltas", "#585a5e"]], "The End & Special": [["The End", "#a7a57b"], ["End Highlands", "#d0d3a3"], ["End Midlands", "#b6b98e"], ["End Barrens", "#777a77"], ["Small End Islands", "#989b85"], ["The Void", "#726986"]]};
const root=document.documentElement,drawer=document.getElementById('biomeDrawer'),biomeButton=document.getElementById('biome'),biomeList=document.getElementById('biomeList'),search=document.getElementById('biomeSearch');
// Colors are coordinated with each biome's mood; the default map viewer stays untouched.
function hexToRgb(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function tint(hex,factor){const [r,g,b]=hexToRgb(hex);return '#'+[r,g,b].map(x=>Math.max(0,Math.min(255,Math.round(x*factor))).toString(16).padStart(2,'0')).join('')}
function theme(name,color){const dark=tint(color,.27);root.style.setProperty('--pink',tint(color,1.30));root.style.setProperty('--line',color+'aa');root.style.setProperty('--glass',dark+'ef');root.style.setProperty('--btn',tint(color,.45)+'ed');root.style.setProperty('--btnhover',tint(color,.7));root.style.setProperty('--glow',color+'70');document.getElementById('biomeLabel').textContent=name==='Cinta Kita'?'Biome colors':name;document.querySelector('.toolbar').title='Palette: '+name;try{localStorage.setItem('ck-map-palette',name)}catch(e){};document.querySelectorAll('.biome-choice').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.biome===name)))}
function render(filter=''){biomeList.innerHTML='';let found=0;for(const [group,arr] of Object.entries(BIOMES)){let filtered=arr.filter(([name])=>name.toLowerCase().includes(filter.toLowerCase()));if(!filtered.length)continue;let h=document.createElement('h3');h.textContent=group;biomeList.appendChild(h);for(const [name,color] of filtered){found++;let b=document.createElement('button');b.type='button';b.className='biome-choice';b.dataset.biome=name;b.setAttribute('aria-pressed','false');let dot=document.createElement('span');dot.className='swatch';dot.style.background=color;let label=document.createElement('span');label.textContent=name;b.append(dot,label);b.addEventListener('click',()=>{theme(name,color);drawer.hidden=true});biomeList.appendChild(b)}}if(!found){let msg=document.createElement('span');msg.textContent='No biome matches that search';biomeList.appendChild(msg)}}
biomeButton.addEventListener('click',()=>{drawer.hidden=!drawer.hidden;if(!drawer.hidden){render(search.value);search.focus()}});document.getElementById('closeBiomes').addEventListener('click',()=>drawer.hidden=true);search.addEventListener('input',()=>render(search.value));document.addEventListener('keydown',e=>{if(e.key==='Escape')drawer.hidden=true});render();let prior='';try{prior=localStorage.getItem('ck-map-palette')||''}catch(e){}for(const entries of Object.values(BIOMES)){const item=entries.find(([name])=>name===prior);if(item){theme(...item);break}}

</script>
</body></html>
